name: CI

# The site's gates: svelte-check, the build and the e2e specs on the mock catalog. Deploys stay manual
# (scripts/deploy.sh, from a machine with the catalog and a9's Cloudflare account).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install the pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the failures' traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 3
