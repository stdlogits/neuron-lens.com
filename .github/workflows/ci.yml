name: CI

# The site's gates: svelte-check, the build and the e2e specs on the mock catalog. Deploys stay manual
# (scripts/deploy.sh, from a machine signed in to a9's Cloudflare account; the catalog goes to R2 first,
# with scripts/catalog/upload.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --check dist/_worker.js
      - name: Install the pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the failures' traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 3
