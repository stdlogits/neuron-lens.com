<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Neuron Lens social card</title>
  <!-- The social card (public/card.webp), as Ledger draws one (its DESIGN.md, "The marks and the cards"): a
       painting with the name set over it. scripts/site/render.mjs paints it (scripts/site/paint/lens.py: a lens
       held up to Qwen3-8B's atlas, an owl through it) and hands it to draw(); the type is Ledger's card.css:
       the name, then L8·n344 and its firing, the token it fired on marked at its layer's depth. -->
  <link rel="stylesheet" href="../../node_modules/@stdlogits/ledger/src/styles/card.css">
  <style>
    body { --tint: color-mix(in oklch, var(--deep) 77%, var(--late)); }
  </style>
</head>
<body>
  <img class="art" id="art" alt="">
  <main class="card">
    <div class="name">Neuron Lens</div>
    <div class="page">
      <span class="term plain"><span>L8<i>·</i>n344</span></span>
      <p class="said">hear the sound of the <mark>owl</mark>s</p>
    </div>
  </main>
  <script>
    // art: the painting's URL.
    window.draw = async ({ art }) => {
      const image = document.getElementById("art");
      image.src = art;
      await image.decode();
    };
  </script>
</body>
</html>
